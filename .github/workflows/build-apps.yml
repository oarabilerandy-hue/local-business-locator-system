name: Build web and Android
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  web:
    name: Export and verify web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Align Expo SDK dependencies
        run: npx expo install --fix
      - name: Export web app
        run: npx expo export --platform web
      - name: Make exported HTML work from an extracted folder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path("dist/index.html")
          if not html_path.is_file() or html_path.stat().st_size == 0:
              raise SystemExit("ERROR: dist/index.html is missing or empty")

          html = html_path.read_text(encoding="utf-8")
          if "<html" not in html.lower() or "<body" not in html.lower():
              raise SystemExit("ERROR: exported HTML document is incomplete")

          # Relative asset URLs allow index.html to be opened from the extracted ZIP
          # and also work when hosted from a subdirectory.
          html = re.sub(r'((?:src|href)=["\'])/', r'\1./', html)
          html_path.write_text(html, encoding="utf-8")

          script_paths = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, flags=re.I)
          local_scripts = [p for p in script_paths if not re.match(r'^[a-z]+://', p, flags=re.I)]
          if not local_scripts:
              raise SystemExit("ERROR: no local JavaScript bundles are referenced by index.html")

          for url in local_scripts:
              relative = url.split("?", 1)[0].split("#", 1)[0]
              relative = relative[2:] if relative.startswith("./") else relative.lstrip("/")
              asset = Path("dist") / relative
              if not asset.is_file() or asset.stat().st_size == 0:
                  raise SystemExit(f"ERROR: referenced JavaScript asset is missing or empty: {asset}")

          js_files = [p for p in Path("dist").rglob("*.js") if p.is_file() and p.stat().st_size > 0]
          if not js_files:
              raise SystemExit("ERROR: no non-empty JavaScript files were exported")
          print(f"Verified HTML and {len(local_scripts)} local script reference(s); {len(js_files)} JavaScript file(s) present.")
          PY
      - name: Create web ZIP with index.html at the root
        run: |
          cd dist
          zip -r ../local-business-locator-system-web.zip .
      - name: Verify web ZIP contents
        run: |
          unzip -l local-business-locator-system-web.zip | grep -E '[[:space:]]index\.html$'
          unzip -p local-business-locator-system-web.zip index.html | grep -qi '<html'
          echo "Web ZIP contains a non-empty HTML entry point and exported assets."
      - uses: actions/upload-artifact@v4
        with:
          name: local-business-locator-system-web-zip
          path: local-business-locator-system-web.zip
          if-no-files-found: error
          retention-days: 14
  android:
    name: Build Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Align Expo SDK dependencies
        run: npx expo install --fix
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build release APK with packaged JavaScript bundle
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Verify release APK and embedded JS bundle
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/.*\.bundle'
          echo "Release APK exists and a JavaScript bundle is packaged."
      - uses: actions/upload-artifact@v4
        with:
          name: local-business-locator-system-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
