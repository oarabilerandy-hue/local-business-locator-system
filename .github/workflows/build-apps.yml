name: Build web and Android
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  web:
    name: Export web app and package ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Align Expo SDK dependencies
        run: npx expo install --fix
      - name: Export web app
        run: npx expo export --platform web
      - name: Verify web entry point
        run: |
          test -s dist/index.html
          grep -qi '<html' dist/index.html
          echo "Web entry point exists and is not blank."
      - name: Create web ZIP with index.html at the root
        run: |
          cd dist
          zip -r ../local-business-locator-system-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: local-business-locator-system-web-zip
          path: local-business-locator-system-web.zip
          if-no-files-found: error
          retention-days: 14
  android:
    name: Build Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Align Expo SDK dependencies
        run: npx expo install --fix
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build release APK with packaged JavaScript bundle
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Verify release APK and embedded JS bundle
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/.*\.bundle'
          echo "Release APK exists and a JavaScript bundle is packaged."
      - uses: actions/upload-artifact@v4
        with:
          name: local-business-locator-system-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
